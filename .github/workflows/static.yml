name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # NEW: This job checks your code first
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check HTML files exist
        run: |
          echo "Checking HTML files..."
          if [ -z "$(find . -name '*.html')" ]; then
            echo "ERROR: No HTML files found!"
            exit 1
          else
            echo "OK: HTML files found"
            find . -name '*.html'
          fi

      - name: Check CSS files exist
        run: |
          if [ -z "$(find . -name '*.css')"]; then
            echo "ERROR: No CSS Files found"
            exit 1
          else
            echo "CSS Files found"
          fi

  # This job only runs if the check job above passes
  deploy:
    needs: check
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
